# Lo mismo que  make check  y  make docker-test , en cada push y pull request.
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La mínima que promete el README y la que se usa a diario.
        python: [ "3.11", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: ffmpeg (los tests generan y validan vídeos reales)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tools tests
      - run: pytest -q

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests dentro de la imagen
        run: |
          docker build --target test -t scheduler:test .
          docker run --rm scheduler:test
      - name: La imagen de la app arranca y responde
        run: |
          docker build --target app -t scheduler:ci .
          docker run -d --name smoke -e ALLOWED_HOSTS=127.0.0.1,localhost -e CAPTION_AI_ENABLED=false \
            -p 127.0.0.1:8787:8787 scheduler:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
